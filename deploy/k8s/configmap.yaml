apiVersion: v1
kind: ConfigMap
metadata: { name: agentscope-config, namespace: agentscope }
data:
  HTTP_ADDR: ":8080"
  REDIS_ADDR: "redis:6379"
  WORKER_PENDING_IDLE_SECONDS: "120"
  WORKER_MAX_ATTEMPTS: "3"
  WORKER_METRICS_ADDR: ":9091"
  WEB_ORIGIN: "https://console.example.com"
  # Enable only after GET /api/v1/agents/migration-status reports legacy_agents=0.
  AGENT_SIGNATURE_REQUIRED: "true"
  DB_MAX_OPEN_CONNS: "50"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME_MINUTES: "30"
