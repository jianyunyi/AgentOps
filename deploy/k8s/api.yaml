apiVersion: apps/v1
kind: Deployment
metadata: { name: agentscope-api, namespace: agentscope }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: agentscope-api } }
  template:
    metadata: { labels: { app: agentscope-api, version: stable } }
    spec:
      serviceAccountName: agentscope
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/jianyunyi/agentscope-api:CHANGE_ME
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: agentscope-config } }, { secretRef: { name: agentscope-secrets } }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: agentscope-api, namespace: agentscope }
spec:
  selector: { app: agentscope-api }
  ports: [{ name: http, port: 80, targetPort: http }]
