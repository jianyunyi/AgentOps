apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscope-web
  namespace: agentscope
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: agentscope-web } }
  template:
    metadata: { labels: { app: agentscope-web } }
    spec:
      serviceAccountName: agentscope
      containers:
        - name: web
          image: ghcr.io/jianyunyi/agentscope-web:CHANGE_ME
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: ""
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: agentscope-web
  namespace: agentscope
spec:
  selector: { app: agentscope-web }
  ports: [{ name: http, port: 80, targetPort: http }]
