services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentscope
      MYSQL_USER: agentscope
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes: [agentops-mysql:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [agentops-redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  api:
    image: ${AGENTOPS_API_IMAGE:?required}
    environment:
      MYSQL_DSN: "agentscope:${MYSQL_PASSWORD}@tcp(mysql:3306)/agentscope?charset=utf8mb4&parseTime=True&loc=UTC"
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      WEB_ORIGIN: http://127.0.0.1:${WEB_PORT}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      AGENT_SIGNING_ENCRYPTION_KEY: ${AGENT_SIGNING_ENCRYPTION_KEY:?required}
    ports: ["127.0.0.1:${API_PORT}:8080"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"], interval: 10s, timeout: 5s, retries: 12 }
  worker:
    image: ${AGENTOPS_API_IMAGE:?required}
    entrypoint: ["/app/worker"]
    environment:
      MYSQL_DSN: "agentscope:${MYSQL_PASSWORD}@tcp(mysql:3306)/agentscope?charset=utf8mb4&parseTime=True&loc=UTC"
      REDIS_ADDR: redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?required}
      AGENT_SIGNING_ENCRYPTION_KEY: ${AGENT_SIGNING_ENCRYPTION_KEY:?required}
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9091/metrics"], interval: 10s, timeout: 5s, retries: 12 }
  web:
    image: ${AGENTOPS_WEB_IMAGE:?required}
    environment: { NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT} }
    ports: ["127.0.0.1:${WEB_PORT}:3000"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 12 }
volumes:
  agentops-mysql: {}
  agentops-redis: {}
