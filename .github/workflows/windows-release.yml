name: windows-self-hosted-release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: go test ./...
      - working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build
      - run: pwsh -File scripts/validate-windows-package.test.ps1
      - run: pwsh -File scripts/verify-windows-acl-test.test.ps1

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race ./internal/selfhost ./cmd/agentopsctl
        env:
          AGENTOPS_RECOVERY_INTEGRATION: "1"

  windows-control-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Run Windows control tests
        shell: pwsh
        run: |
          go test -json -count=1 ./internal/selfhost ./cmd/agentopsctl | Tee-Object -FilePath windows-control-tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows protected ACL test executed
        shell: pwsh
        run: ./scripts/verify-windows-acl-test.ps1 -ResultsPath windows-control-tests.json
      - name: Verify startup and recovery exclusion tests executed
        shell: pwsh
        run: |
          $events = @(Get-Content windows-control-tests.json | ForEach-Object { $_ | ConvertFrom-Json })
          foreach ($test in @('TestStartRestoreMutualExclusion', 'TestRestoreCannotEnterWhileStartRuns', 'TestStartRejectsStaleRecoveryLock')) {
            $testEvents = @($events | Where-Object { $_.Package -eq 'agentscope/cmd/agentopsctl' -and $_.Test -eq $test })
            if (-not ($testEvents | Where-Object { $_.Action -eq 'run' }) -or
                -not ($testEvents | Where-Object { $_.Action -eq 'pass' }) -or
                ($testEvents | Where-Object { $_.Action -in @('skip', 'fail') })) {
              throw "Startup/recovery exclusion test must execute and pass: $test"
            }
          }
      - run: go build -o dist/agentopsctl.exe ./cmd/agentopsctl
      - run: choco install innosetup --no-progress -y
      - run: iscc installer/AgentOps.iss

  package:
    needs: [verify, recovery, windows-control-tests]
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build Windows control CLI
        run: go build -o dist/agentopsctl.exe ./cmd/agentopsctl
        env:
          GOOS: windows
          GOARCH: amd64
      - name: Install Inno Setup
        run: choco install innosetup syft --no-progress -y
      - name: Build installer
        run: iscc installer/AgentOps.iss
      - name: Generate SBOM
        run: syft dir:. -o spdx-json=dist/agentops.spdx.json
      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: AgentOps-Windows-x64, path: dist/* }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
