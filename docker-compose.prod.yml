services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentscope
      MYSQL_USER: agentscope
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      MYSQL_DSN: "agentscope:${MYSQL_PASSWORD}@tcp(mysql:3306)/agentscope?charset=utf8mb4&parseTime=True&loc=UTC"
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"], interval: 10s, timeout: 5s, retries: 12 }
  worker:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/app/worker"]
    environment:
      MYSQL_DSN: "agentscope:${MYSQL_PASSWORD}@tcp(mysql:3306)/agentscope?charset=utf8mb4&parseTime=True&loc=UTC"
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes: { mysql-data: {}, redis-data: {} }
